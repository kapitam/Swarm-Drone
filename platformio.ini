; PlatformIO Project Configuration — Swarm Drone firmware
;
; Fork matrix (see docs/HANDBOOK.md): every env is one combination of the
; build-time variant flags. All variants compile in CI; pick by env name.
;
;   PERCEPTION_V1_TOF     VL53L5CX 8x8 ToF -> 8-sector polar array (reference)
;   PERCEPTION_V2_VISION  camera + ML depth-to-sectors (advisory; S3 only)
;   VISION_BACKEND_TFLM / VISION_BACKEND_STUB
;   MOTORS_ESC_PWM (50 Hz 1000-2000 us) / MOTORS_BRUSHED_PWM (20 kHz duty)
;   IMU_MPU6050 / IMU_ICM42688 / IMU_MOCK
;   RC_LINK_NRF24 / RC_LINK_ESPNOW
;
; Platform pin: pioarduino 55.03.311 = Arduino core 3.3.11 / ESP-IDF 5.5.5,
; which bundles esp-tflite-micro 1.3.7 + esp-nn 1.2.3 (research doc 09) and
; esp32-camera. Do not "upgrade" casually; the ML runtime is pinned to this.

[platformio]
default_envs = devkit_v1_tof

; VL53L5CX I2C frame trimming (research doc 08 s2.3): keep distance,
; target status, nb-targets; strip per-SPAD outputs and motion indicator
; -> ~8-13 ms/frame @ 400 kHz. Compile-time flags shared by lib + app.
[tof]
build_flags =
	-D VL53L5CX_DISABLE_AMBIENT_PER_SPAD
	-D VL53L5CX_DISABLE_NB_SPADS_ENABLED
	-D VL53L5CX_DISABLE_SIGNAL_PER_SPAD
	-D VL53L5CX_DISABLE_MOTION_INDICATOR

[esp32base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-Wall

; ---------------------------------------------------------------------------
; Build A "Reference" — classic ESP32 DevKit v1, ToF, hobby ESC, nRF24 RC.
; Closest to the original sketch's hardware (nRF24 on VSPI, ESC-style PWM).
; ---------------------------------------------------------------------------
[env:devkit_v1_tof]
extends = esp32base
board = esp32doit-devkit-v1
build_flags =
	${esp32base.build_flags}
	${tof.build_flags}
	-D BOARD_DEVKIT_V1
	-D PERCEPTION_V1_TOF
	-D MOTORS_ESC_PWM
	-D IMU_MPU6050
	-D RC_LINK_NRF24
lib_deps =
	nrf24/RF24@^1.5.0
	sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3

; ---------------------------------------------------------------------------
; Build A' "PCB variant" — same board, brushed coreless motors (PCB-drone
; style, Crazyflie-like), ICM-42688 IMU, RC over ESP-NOW (single radio).
; ---------------------------------------------------------------------------
[env:devkit_v1_brushed]
extends = esp32base
board = esp32doit-devkit-v1
build_flags =
	${esp32base.build_flags}
	${tof.build_flags}
	-D BOARD_DEVKIT_V1
	-D PERCEPTION_V1_TOF
	-D MOTORS_BRUSHED_PWM
	-D IMU_ICM42688
	-D RC_LINK_ESPNOW
lib_deps =
	sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3

; ---------------------------------------------------------------------------
; Build B "Vision" — XIAO ESP32S3 Sense: camera + TFLM SectorNet (advisory)
; with the VL53L5CX co-mounted as stop-reflex owner + training teacher,
; SD dataset logger. ESP-NOW only (SD owns the sole exposed SPI bus, doc 09).
; ---------------------------------------------------------------------------
[env:xiao_s3_vision]
extends = esp32base
board = seeed_xiao_esp32s3
board_build.psram_type = opi
build_flags =
	${esp32base.build_flags}
	${tof.build_flags}
	-D BOARD_XIAO_S3
	-D PERCEPTION_V1_TOF
	-D PERCEPTION_V2_VISION
	-D VISION_BACKEND_TFLM
	-D DATALOGGER_SD
	-D MOTORS_BRUSHED_PWM
	-D IMU_MPU6050
	-D RC_LINK_ESPNOW
	-D BOARD_HAS_PSRAM
lib_deps =
	sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3

; Same as xiao_s3_vision but with the stub inference backend (no model
; needed): proves the perception interface + logger without TFLM at runtime.
[env:xiao_s3_vision_stub]
extends = esp32base
board = seeed_xiao_esp32s3
board_build.psram_type = opi
build_flags =
	${esp32base.build_flags}
	${tof.build_flags}
	-D BOARD_XIAO_S3
	-D PERCEPTION_V1_TOF
	-D PERCEPTION_V2_VISION
	-D VISION_BACKEND_STUB
	-D DATALOGGER_SD
	-D MOTORS_BRUSHED_PWM
	-D IMU_MPU6050
	-D RC_LINK_ESPNOW
	-D BOARD_HAS_PSRAM
lib_deps =
	sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3

; ---------------------------------------------------------------------------
; Host-native unit tests for lib/swarmcore (pure C++17, no Arduino).
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
	-std=gnu++17
	-Wall
	-D SWARMCORE_NATIVE
